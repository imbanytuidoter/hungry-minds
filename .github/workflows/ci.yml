name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: Contract — test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: cargo-${{ hashFiles('contract/Cargo.lock') }}

      - name: Unit tests
        run: cargo test --locked

      - name: Build wasm
        # --cfg near is what cargo-near sets; without it contract errors reach users as a bare
        # "wasm trap: unreachable"
        run: cargo build --target wasm32-unknown-unknown --release --locked
        env:
          RUSTFLAGS: --cfg near

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hungry-minds-contract
          path: contract/target/wasm32-unknown-unknown/release/hungry_minds_contract.wasm

  web:
    name: Web — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint components lib app
      - run: npm run build # also type-checks the app
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  node:
    name: Worker + SDK — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            sdk/package-lock.json

      - name: Worker
        working-directory: worker
        run: |
          npm ci
          node --test

      - name: SDK
        working-directory: sdk
        run: |
          npm ci
          node --test
