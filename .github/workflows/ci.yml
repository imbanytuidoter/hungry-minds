name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: Contract — test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: cargo-${{ hashFiles('contract/Cargo.lock') }}

      - name: Unit tests
        run: cargo test --locked

      - name: Install cargo-near
        run: cargo install cargo-near --locked

      - name: Build optimized wasm + ABI
        run: cargo near build non-reproducible-wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hungry-minds-contract
          path: |
            contract/target/near/*.wasm
            contract/target/near/*_abi.json

  web:
    name: Web — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  integration:
    name: Integration — sandbox game loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: cargo-${{ hashFiles('contract/Cargo.lock') }}

      - name: Build contract wasm
        working-directory: contract
        run: cargo build --target wasm32-unknown-unknown --release --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sandbox tests
        working-directory: integration
        run: |
          npm ci
          npm test
        env:
          CONTRACT_WASM: ${{ github.workspace }}/contract/target/wasm32-unknown-unknown/release/hungry_minds_contract.wasm
