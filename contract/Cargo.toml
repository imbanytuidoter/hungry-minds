[package]
name = "hungry-minds-contract"
version = "0.1.0"
edition = "2021"
description = "Hungry Minds — NEP-171 Minds that pay for their own AI replies from their own food balance."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Shrinks the sleep->ghost window to minutes for the live testnet demo so judges
# see the whole lifecycle arc. NEVER enabled for a mainnet build.
demo-window = []

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"
base64 = "0.22.1" # on-chain SVG -> data: URI for token media

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
overflow-checks = true
